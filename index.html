<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INKLU</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #b3e5fc;
    }

    header {
      background-color: #0d47a1;
      color: white;
      text-align: center;
      padding: 1rem;
      position: relative;
    }

    header .back-btn {
      position: absolute;
      left: 1rem;
      top: 1rem;
      font-size: 1.5rem;
      color: white;
      text-decoration: none;
    }

    .map-container {
      margin: 1rem;
      border-radius: 8px;
      overflow: hidden;
    }

    .map-container iframe {
      width: 100%;
      height: 300px;
      border: none;
    }

    .location-btn {
      display: block;
      margin: 1rem auto;
      padding: 1rem 2rem;
      background-color: #0d47a1;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
    }

    nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background-color: #0d47a1;
      display: flex;
      justify-content: space-around;
      padding: 0.9rem 0;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 1.5rem;
    }

    nav a i {
        color: white;
        font-size: 1.9rem;
    }


    /* Modal estilo iOS */
    .modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.3);
    justify-content: center;
    align-items: center;
    z-index: 1000;
    }

    .modal-content {
    background-color: #fff;
    border-radius: 20px;
    width: 85%;
    max-width: 300px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .modal-content p {
    padding: 1.2rem;
    font-size: 1.3rem;
    font-weight: 500;
    color: #333;
    text-align: center;
    margin: 0;
    border-bottom: 1px solid #eee;
    }

    .modal-content .ios-buttons {
    display: flex;
    flex-direction: column;
    }

    .modal-content button {
    padding: 1rem;
    font-size: 1.2rem;
    font-weight: bold;
    border: none;
    background: none;
    cursor: pointer;
    transition: background 0.3s;
    }

    .modal-content button:not(:last-child) {
    border-bottom: 1px solid #eee;
    }

    .modal-content .confirm {
    color: #007aff;
    font-weight: 600;
    }

    .modal-content .cancel {
    color: #4a4a4a;
    font-weight: 600;
    }

 #voice-container {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  padding-bottom: 7rem;
  margin-top: 5rem;
}

#voice-button {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: none;
  background: #0d47a1;
  color: white;
  font-size: 2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
  cursor: pointer;
  transition: transform 0.2s ease;
}

#voice-button.listening {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

#voice-status {
  margin-top: 1rem;
  font-size: 1.3rem;
  font-weight: bold;
  color: #0d47a1;
  text-align: center;
}



  </style>
</head>
<body>

  <header>
    <a href="#" class="back-btn">&#8592;</a>
    <h1>INKLU</h1>
  </header>

  <div class="map-container">
    <iframe
      id="map-frame"
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3036.361324128967!2d-3.7037905846031565!3d40.4167752793646!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd42299772de28e1%3A0x799004d2c60c7b97!2sMadrid!5e0!3m2!1ses!2ses!4v1625246397080!5m2!1ses!2ses"
      allowfullscreen=""
      loading="lazy">
    </iframe>
  </div>

  <button class="location-btn" id="location-btn">Activar ubicación</button>

<!-- Círculo animado de reconocimiento de voz -->
<div id="voice-container">
  <button id="voice-button"><i class="fas fa-microphone"></i></button>
  <p id="voice-status">Pulsa para hablar</p>
</div>





  <nav>
    <a href="notificaciones.html"><i class="fas fa-bell"></i></a>
    <a href="perfil.html"><i class="fas fa-user"></i></a>
    <a href="index.html"><i class="fas fa-home"></i></a>
    <a href="mensajes.html"><i class="fas fa-envelope"></i></a>
    <a href="ajustes.html"><i class="fas fa-cog"></i></a>
</nav>


  <!-- Modal de confirmación -->
  <div class="modal" id="modal">
    <div class="modal-content">
        <p id="modal-text">¿Quieres activar la ubicación?</p>
        <div class="ios-buttons">
        <button class="confirm" id="confirm-btn">Sí</button>
        <button class="cancel" id="cancel-btn">Cancelar</button>
  </div>
</div>

  </div>

  <script>
    const btn = document.getElementById('location-btn');
    const mapFrame = document.getElementById('map-frame');
    const modal = document.getElementById('modal');
    const modalText = document.getElementById('modal-text');
    const confirmBtn = document.getElementById('confirm-btn');
    const cancelBtn = document.getElementById('cancel-btn');

    let locationActive = false;
    let watchId = null;

    btn.addEventListener('click', () => {
      modalText.textContent = locationActive
        ? '¿Quieres desactivar la ubicación?'
        : '¿Quieres activar la ubicación?';
      modal.style.display = 'flex';
    });

    confirmBtn.addEventListener('click', () => {
      modal.style.display = 'none';

      if (!locationActive) {
        if (navigator.geolocation) {
          watchId = navigator.geolocation.watchPosition(
            position => {
              const lat = position.coords.latitude;
              const lon = position.coords.longitude;
              mapFrame.src = `https://www.google.com/maps?q=${lat},${lon}&z=15&output=embed`;
              btn.textContent = "Desactivar ubicación";
              locationActive = true;
            },
            error => {
              alert("No se pudo obtener tu ubicación.");
            }
          );
        } else {
          alert("Tu navegador no soporta geolocalización.");
        }
      } else {
        navigator.geolocation.clearWatch(watchId);
        mapFrame.src = "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3036.361324128967!2d-3.7037905846031565!3d40.4167752793646!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd42299772de28e1%3A0x799004d2c60c7b97!2sMadrid!5e0!3m2!1ses!2ses!4v1625246397080!5m2!1ses!2ses";
        btn.textContent = "Activar ubicación";
        locationActive = false;
      }
    });

    cancelBtn.addEventListener('click', () => {
      modal.style.display = 'none';
    });
  </script>
  <script>
  const voiceButton = document.getElementById('voice-button');
const statusText = document.getElementById('voice-status');

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
  statusText.textContent = "Reconocimiento de voz no soportado.";
  voiceButton.style.opacity = 0.5;
  voiceButton.style.pointerEvents = "none";
} else {
  const recognition = new SpeechRecognition();
  recognition.lang = 'es-ES';
  recognition.interimResults = false;

  recognition.onstart = () => {
    voiceButton.classList.add('listening');
    statusText.textContent = "Escuchando...";
  };

  recognition.onend = () => {
    voiceButton.classList.remove('listening');
    statusText.textContent = "Pulsa para hablar";
    isListening = false;
  };

  recognition.onerror = e => {
    voiceButton.classList.remove('listening');
    statusText.textContent = "Error: " + e.error;
  };

  recognition.onresult = event => {
    const transcript = event.results[0][0].transcript.toLowerCase();
    console.log("Comando reconocido:", transcript);

    if (transcript.includes("perfil")) {
      window.location.href = "perfil.html";
    } else if (transcript.includes("mensaje")) {
      window.location.href = "mensajes.html";
    } else if (transcript.includes("ajuste")) {
      window.location.href = "ajustes.html";
    } else if (transcript.includes("mapa")) {
      window.location.href = "index.html";
    } else if (transcript.includes("notificación")) {
      window.location.href = "notificaciones.html";
    } else {
      statusText.textContent = "Comando no reconocido.";
    }
  };

  let isListening = false;

  voiceButton.addEventListener('click', () => {
    if (!isListening) {
      recognition.start();
      isListening = true;
    } else {
      recognition.stop();
      isListening = false;
      voiceButton.classList.remove('listening');
      statusText.textContent = "Detenido.";
    }
  });
}

</script>



</body>
</html>
